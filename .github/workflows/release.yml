name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v1.2.0)
        required: true
        type: string
      all_platforms:
        description: Also build macOS x64, Windows arm64, and Linux x64/arm64
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check tag and versions
        id: version
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          TAG="$REQUESTED_TAG"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          git rev-parse "$TAG" >/dev/null
          node scripts/check-version.mjs "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  test:
    name: Release tests
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run unit tests
        run: npm test
      - name: Test native installers
        run: npm run test:installers
      - name: Check JavaScript syntax
        run: |
          for file in src/background/*.js src/content/*.js src/shared/*.js tests/*.js; do
            node --check "$file"
          done
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"

  build-extension:
    name: Extension package
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Create extension ZIP
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p release
          zip -r "release/pindownloader-extension-v${VERSION}.zip" \
            manifest.json src _locales icons README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: release/*
          if-no-files-found: error

  build-macos-arm64:
    name: macOS arm64 package
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Build helper
        run: bash native/macos/build-macos.sh arm64
      - name: Package helper
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          STAGE="stage/macos-arm64"
          mkdir -p "$STAGE"
          cp dist/macos-arm64/PinDownloaderClipboard "$STAGE/"
          cp native/macos/install-macos.sh "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          chmod 755 "$STAGE/install-macos.sh" "$STAGE/PinDownloaderClipboard"
          tar -C "$STAGE" -czf "pindownloader-native-macos-arm64-v${VERSION}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: pindownloader-native-macos-arm64-*.tar.gz
          if-no-files-found: error

  build-macos-x64:
    name: macOS x64 package
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && inputs.all_platforms
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Build helper
        run: bash native/macos/build-macos.sh x64
      - name: Package helper
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          STAGE="stage/macos-x64"
          mkdir -p "$STAGE"
          cp dist/macos-x64/PinDownloaderClipboard "$STAGE/"
          cp native/macos/install-macos.sh "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          chmod 755 "$STAGE/install-macos.sh" "$STAGE/PinDownloaderClipboard"
          tar -C "$STAGE" -czf "pindownloader-native-macos-x64-v${VERSION}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: pindownloader-native-macos-x64-*.tar.gz
          if-no-files-found: error

  build-windows-x64:
    name: Windows x64 package
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build helper
        shell: pwsh
        run: ./native/windows/build-windows.ps1 -Architecture x64
      - name: Package helper
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          Compress-Archive -Force `
            -Path @(
              'dist\windows-x64\PinDownloaderClipboard.exe',
              'native\windows\install-windows.ps1',
              'README.md',
              'LICENSE'
            ) `
            -DestinationPath "pindownloader-native-windows-x64-v$env:VERSION.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: pindownloader-native-windows-x64-*.zip
          if-no-files-found: error

  build-windows-arm64:
    name: Windows arm64 package
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && inputs.all_platforms
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build helper
        shell: pwsh
        run: ./native/windows/build-windows.ps1 -Architecture arm64
      - name: Package helper
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          Compress-Archive -Force `
            -Path @(
              'dist\windows-arm64\PinDownloaderClipboard.exe',
              'native\windows\install-windows.ps1',
              'README.md',
              'LICENSE'
            ) `
            -DestinationPath "pindownloader-native-windows-arm64-v$env:VERSION.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: pindownloader-native-windows-arm64-*.zip
          if-no-files-found: error

  build-linux-x64:
    name: Linux x64 package
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && inputs.all_platforms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and test helper
        run: |
          bash native/linux/build-linux.sh x64
          npm run test:native:linux
      - name: Package helper
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          STAGE="stage/linux-x64"
          mkdir -p "$STAGE"
          cp dist/linux-x64/PinDownloaderClipboard "$STAGE/"
          cp native/linux/install-linux.sh "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          chmod 755 "$STAGE/install-linux.sh" "$STAGE/PinDownloaderClipboard"
          tar -C "$STAGE" -czf "pindownloader-native-linux-x64-v${VERSION}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: pindownloader-native-linux-x64-*.tar.gz
          if-no-files-found: error

  build-linux-arm64:
    name: Linux arm64 package
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && inputs.all_platforms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build helper
        run: bash native/linux/build-linux.sh arm64
      - name: Package helper
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          STAGE="stage/linux-arm64"
          mkdir -p "$STAGE"
          cp dist/linux-arm64/PinDownloaderClipboard "$STAGE/"
          cp native/linux/install-linux.sh "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          chmod 755 "$STAGE/install-linux.sh" "$STAGE/PinDownloaderClipboard"
          tar -C "$STAGE" -czf "pindownloader-native-linux-arm64-v${VERSION}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: pindownloader-native-linux-arm64-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs:
      - prepare
      - test
      - build-extension
      - build-macos-arm64
      - build-macos-x64
      - build-windows-x64
      - build-windows-arm64
      - build-linux-x64
      - build-linux-arm64
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          cd ..
          ls -l release-assets
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "PinDownloader $TAG" \
              --generate-notes
          fi
